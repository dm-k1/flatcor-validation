# Estimates how long the full validation takes, before renting anything for it.
#
# Every study runs in timing mode (R/shared/pipeline.R) inside the published
# image: the full design and full-length chains, on two fractions of its
# datasets, each on its own runner (4 cores). R/timing/estimate_run_time.R then
# fits the fixed part and the part per dataset and reads off the full run; the
# table appears on the run's summary page and as the artifact run-time-estimate.
# Studies 1a (it does not depend on the number of datasets) and 1b (20 per
# prior, too few to scale) run in full. The fractions, 4% and 6%, give exact
# numbers of datasets for every study (3b: 2 and 3 per growing-k cell, 4 and
# 6 per rates cell); only 3a's repeated runs (part B, 20 datasets) stay at 2
# in both, so the estimate counts part B low.
#
# It runs on demand only (Actions > "Run-time estimate" > Run workflow): the
# validation is run once, for the paper, and an estimate takes hours (study
# 3b most), so it no longer starts on every push. A newer run cancels one
# still going. On a public repository the runners are free; it takes about
# as long as the slowest job.
name: Run-time estimate

on:
  workflow_dispatch:
    inputs:
      fractions:
        description: Fractions of the datasets to time each study at (JSON list)
        default: '["0.04", "0.06"]'

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # When an image build for this branch is still running (renv.lock changed in
  # this push or a recent one), time the new image, not the one before it.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - name: Wait for the branch's latest image build, if it is still running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          while true; do
            state=$(gh run list -R "$GITHUB_REPOSITORY" --workflow image.yml \
              --branch "$GITHUB_REF_NAME" --limit 1 --json status,conclusion \
              -q '.[0] // empty | "\(.status) \(.conclusion)"')
            case "$state" in
              "") echo "No image build for this branch"; exit 0 ;;
              "completed success") echo "Image built"; exit 0 ;;
              completed*) echo "Image build ended: $state"; exit 1 ;;
            esac
            sleep 60
          done

  time:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        study: ["2a", "2b", "3a", "3b"]
        fraction: ${{ fromJSON(inputs.fractions || '["0.04", "0.06"]') }}
        include:
          - study: "1a"
            fraction: "1"
          - study: "1b"
            fraction: "1"
    name: study ${{ matrix.study }} at ${{ matrix.fraction }}
    steps:
      - uses: actions/checkout@v4

      - name: Time the study
        run: |
          docker run --rm -v "$PWD":/project \
            -e VALIDATION_TIMING=${{ matrix.fraction }} \
            ghcr.io/${{ github.repository_owner }}/flatcor-validation:${{ github.ref_name }} \
            Rscript R/timing/time_study.R ${{ matrix.study }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-${{ matrix.study }}-at-${{ matrix.fraction }}
          path: cache/timing/time_*.rds
          if-no-files-found: ignore

  estimate:
    needs: time
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: time-*
          path: timing
          merge-multiple: true

      - name: Scale up to the full run
        run: |
          docker run --rm -v "$PWD":/project \
            ghcr.io/${{ github.repository_owner }}/flatcor-validation:${{ github.ref_name }} \
            Rscript R/timing/estimate_run_time.R timing | tee run_time_estimate.md
          cat run_time_estimate.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: run-time-estimate
          path: |
            run_time_estimate.md
            timing/
