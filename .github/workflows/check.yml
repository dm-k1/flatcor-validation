# Checks the validation on every push to main or v2: five independent jobs that
# start at the same time, written from the quickest to the slowest.
#
#   lint        lintr, in the style of .lintr (seconds)
#   static      the static check (R/shared/static_check.R): the pipeline is
#               valid, every function called exists, and the code keeps to
#               the declared way (expensive calls replayable, files declared
#               as steps); inside the published image, for its packages
#   links       every link in the README, the docs and the notebook (seconds)
#   workflows   actionlint on these workflow files (seconds)
#   smoke       the smoke test (VALIDATION_SMOKE=1 Rscript run_all.R: a corner
#               of every study, from scratch, and every figure) inside the
#               published image, so with exactly the packages and CmdStan of
#               the real run (about 40 minutes); skipped when this commit's
#               own image build already ran it before publishing. It fails
#               when the outputs check (R/shared/check_results.R) finds a
#               missing file or figure, an empty table, or NA/NaN/Inf. It runs
#               with 3 workers (16 cores pretended: (16 - 1) %/% 4), as a
#               real run has several: clashes between workers only show then
#
# On a public repository the runners are free. The run-time estimate
# (timing.yml) is separate and runs on demand only.
name: Check

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Lint
        run: |
          install.packages("lintr")
          lints <- lintr::lint_dir(".")
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static check
        run: |
          docker run --rm -v "$PWD":/project \
            ghcr.io/${{ github.repository_owner }}/flatcor-validation:${{ github.ref_name }} \
            Rscript R/shared/static_check.R

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 403: publishers (such as Wiley) refuse automated requests to links
      # that work in a browser; temporary errors are retried. A file on
      # GitHub is checked as its raw file: GitHub's rendered page of a long
      # document (appendix A) can answer 503 to automated requests.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept '200..=299,403' --max-retries 3
            --remap 'https://github.com/([^/]+)/([^/]+)/blob/(.*) https://raw.githubusercontent.com/$1/$2/$3'
            README.md 'docs/**/*.md' cluster/README.md validation.ipynb
          fail: true

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # when renv.lock changed in this push or a recent one, the image is
      # still being built: smoke-test the new image, not the one before it.
      # An image build smoke-tests the pipeline itself before it publishes:
      # if that build was for this very commit, the test has already run.
      - name: Wait for the branch's latest image build, if it is still running
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          while true; do
            build=$(gh run list -R "$GITHUB_REPOSITORY" --workflow image.yml \
              --branch "$GITHUB_REF_NAME" --limit 1 --json status,conclusion,headSha \
              -q '.[0] // empty | "\(.status) \(.conclusion) \(.headSha)"')
            read -r status conclusion sha <<< "$build"
            case "$status $conclusion" in
              " ") echo "No image build for this branch"; break ;;
              "completed success")
                echo "Image built"
                if [ "$sha" = "$GITHUB_SHA" ]; then
                  echo "That build smoke-tested this commit already"
                  echo "already_tested=true" >> "$GITHUB_OUTPUT"
                fi
                break ;;
              completed*) echo "Image build ended: $status $conclusion"; exit 1 ;;
            esac
            sleep 60
          done

      - uses: actions/checkout@v4
        if: steps.image.outputs.already_tested != 'true'

      - name: Smoke test
        if: steps.image.outputs.already_tested != 'true'
        run: |
          docker run --rm -v "$PWD":/project \
            -e VALIDATION_SMOKE=1 -e R_PARALLELLY_AVAILABLECORES_SYSTEM=16 \
            ghcr.io/${{ github.repository_owner }}/flatcor-validation:${{ github.ref_name }} \
            Rscript run_all.R
